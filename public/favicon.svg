<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Samurai Realm">
  <defs>
    <linearGradient id="gold" x1="18" y1="12" x2="110" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3C4"/>
      <stop offset="0.35" stop-color="#E8C56A"/>
      <stop offset="0.7" stop-color="#C9962E"/>
      <stop offset="1" stop-color="#8F6A1A"/>
    </linearGradient>
    <linearGradient id="blade" x1="28" y1="96" x2="102" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8DE"/>
      <stop offset="0.45" stop-color="#F0D78A"/>
      <stop offset="1" stop-color="#B8892D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E8C56A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- outer ring -->
  <circle cx="64" cy="64" r="52" stroke="url(#gold)" stroke-width="2.5" opacity="0.95"/>
  <circle cx="64" cy="64" r="46" stroke="url(#gold)" stroke-width="1" opacity="0.35"/>

  <!-- katana (diagonal) -->
  <g filter="url(#soft)" transform="rotate(-42 64 64)">
    <!-- blade -->
    <path
      d="M64 18 L68 70 L64 108 L60 70 Z"
      fill="url(#blade)"
    />
    <path
      d="M64 18 L66.2 70 L64 100"
      stroke="#FFF8DE"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.55"
    />
    <!-- tsuba -->
    <ellipse cx="64" cy="72" rx="11" ry="4.5" fill="url(#gold)" stroke="#F5E6B8" stroke-width="0.8"/>
    <ellipse cx="64" cy="72" rx="4" ry="1.6" fill="#8F6A1A" opacity="0.45"/>
    <!-- tsuka -->
    <rect x="59.5" y="74" width="9" height="26" rx="2" fill="url(#gold)"/>
    <path d="M61.5 78 H66.5 M61.5 82 H66.5 M61.5 86 H66.5 M61.5 90 H66.5 M61.5 94 H66.5"
      stroke="#8F6A1A" stroke-width="0.9" opacity="0.55" stroke-linecap="round"/>
    <!-- kashira -->
    <rect x="58.5" y="98" width="11" height="5" rx="1.5" fill="url(#gold)"/>
  </g>

  <!-- accent dots -->
  <circle cx="64" cy="18" r="2.2" fill="#FFF3C4"/>
  <circle cx="64" cy="110" r="2.2" fill="#C9962E" opacity="0.8"/>
</svg>
